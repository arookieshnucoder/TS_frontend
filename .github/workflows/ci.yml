name: Frontend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: frontend
          clean: false
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.BACKEND_REPOSITORY || 'arookieshnucoder/TS_backend' }}
          # BACKEND_REF 可固定配套发布版本；后端需包含统一认证模块。
          ref: ${{ vars.BACKEND_REF || 'master' }}
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          path: backend
          clean: false
          persist-credentials: false
      - name: 记录前后端版本
        run: |
          git -C frontend log -1 --format='frontend: %H %s'
          git -C backend log -1 --format='backend: %H %s'
      - name: 验证联调后端兼容性
        run: node frontend/scripts/check-backend.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: 测试
        run: npm test
        working-directory: frontend
        timeout-minutes: 3
      - name: 构建
        run: npm run build
        working-directory: frontend
      # 暂停日常 CI 的 Docker 镜像构建；仍保留测试、类型检查和应用构建。
