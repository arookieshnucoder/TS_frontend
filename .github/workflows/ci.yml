name: Frontend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: frontend
          clean: false
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.BACKEND_REPOSITORY || 'arookieshnucoder/TS_backend' }}
          # 匹配 harness 版本
          ref: ${{ vars.BACKEND_REF || '2635abec3f1c43e7ba2b9806b6ee6aec327e1502' }}
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          path: backend
          clean: false
          persist-credentials: false
      - name: 记录前后端版本
        run: |
          git -C frontend log -1 --format='frontend: %H %s'
          git -C backend log -1 --format='backend: %H %s'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: 测试
        run: npm test
        working-directory: frontend
      - name: 构建
        run: npm run build
        working-directory: frontend
      - name: 构建 Docker 镜像
        run: docker build --tag ragagent-frontend:ci frontend
